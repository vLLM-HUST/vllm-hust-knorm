[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hust-knorm"
description = "KNorm key-L2-norm KV-cache compression for vLLM-HUST, as a runtime-loadable extension bundle"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "vLLM-HUST KNorm maintainers" }]
dependencies = []
dynamic = ["version"]
keywords = ["vllm", "kv-cache", "compression", "knorm", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
# setuptools is needed for the in-test `python -m build --no-isolation`
# packaging gates (test_packaging.py).
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2", "setuptools>=68", "wheel"]

# Runtime plugin hook. vLLM calls it in every process during plugin
# loading; registration installs the patches, VLLM_KNORM_ENABLED=1 is
# the explicit activation switch.
[project.entry-points."vllm.general_plugins"]
"vllm-hust-knorm" = "vllm_hust_knorm.bootstrap:register_plugins"

# Extension Manager discovery (static manifest locator; the manager
# reads the JSON next to this package without importing any
# implementation). Registration name must equal the extension_id.
[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.knorm" = "vllm_hust_knorm.manifests"

[tool.setuptools.dynamic]
version = { attr = "vllm_hust_knorm._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_hust_knorm = ["manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately reach into module privates.
"tests/*" = ["S101"]
