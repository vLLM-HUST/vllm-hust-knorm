name: Extension CI

# Minimum gate from the vLLM-HUST extension author guide (§15) plus the
# packaging-and-release guide's wheel verification steps. No self-hosted
# runners: NPU acceptance runs on authorized machines and its evidence
# is recorded in HOST_CONTRACT.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - name: Verify wheel contents
        run: bash scripts/verify-wheel.sh dist/*.whl
      - name: Isolated smoke install
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-cache-dir dist/*.whl
          .release-smoke/bin/python - <<'PY'
          import importlib.metadata as im
          import json, pathlib, vllm_hust_knorm
          import vllm_hust_knorm.manifests as m

          # Version consistency: distribution metadata == package ==
          # manifest extension_version (never hardcoded here).
          assert im.version("vllm-hust-knorm") == vllm_hust_knorm.__version__
          manifest = json.loads(
              (pathlib.Path(m.__file__).parent
               / "vllm-hust-extension-v0.2.json").read_text()
          )
          assert manifest["extension_id"] == "org.vllm-hust.knorm"
          assert manifest["extension_version"] == vllm_hust_knorm.__version__

          # Static discovery surface: both entry points registered and
          # discovery imports no implementation.
          eps = im.entry_points()
          bundles = list(eps.select(group="vllm_hust.extension_bundles"))
          general = list(eps.select(group="vllm.general_plugins"))
          assert [e.name for e in bundles] == ["org.vllm-hust.knorm"]
          assert [e.name for e in general] == ["vllm-hust-knorm"]
          print("smoke OK:", vllm_hust_knorm.__version__)
          PY
      - name: Validate extension manifest
        run: |
          python - <<'PY'
          import json
          p = json.load(open(
              "src/vllm_hust_knorm/manifests/vllm-hust-extension-v0.2.json"
          ))
          assert p["schema_version"] == "0.2-experimental"
          assert p["extension_id"] == "org.vllm-hust.knorm"
          assert p["host"] == {"provider": "vllm", "name": "vllm",
                               "version_range": ">=0.23",
                               "api_range": ">=1,<2"}
          assert len(p["components"]) == 2
          print("manifest OK")
          PY
